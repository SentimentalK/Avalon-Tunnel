services:
  v2ray:
    image: v2fly/v2fly-core:latest
    container_name: avalon-v2ray
    restart: unless-stopped
    volumes:
      - ./config.json:/etc/v2ray/config.json:ro
    command: ["run", "-c", "/etc/v2ray/config.json"]

  traefik:
    image: traefik:v3.0
    container_name: avalon-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./data/traefik:/acme
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@your-domain.com}
      - TRAEFIK_ACME_CASERVER=${TRAEFIK_ACME_CASERVER:-}
    depends_on:
      - v2ray

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avalon-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app/config
      - ./data:/app/config/data
    environment:
      - BASE_DIR=/app/config
